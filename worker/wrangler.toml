name = "seoji"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 공개 저장소라 메일 주소(NOTIFY_TO, NOTIFY_FROM)는 여기 적지 않고 대시보드 변수로 둔다. 배포해도 지워지지 않게 한다
keep_vars = true

# Cloudflare cron 은 UTC 기준. 00:15 UTC = 09:15 KST
# 그날 입력분은 다음 날 하루에 걸쳐 일괄 등록되므로 그저께 입력분을 받는다 (collect.js kstTargetDate)
[triggers]
crons = ["15 0 * * *"]

# Workers Logs: 대시보드에서 실행 결과·console 로그 확인. Free 는 하루 200,000건, 3일 보관
[observability]
enabled = true
head_sampling_rate = 1

# 로컬에서는 .dev.vars 가 이 값을 덮어쓴다 (가짜 API 주소 등)
[vars]
GITHUB_REPO = "seoh/seoji"
GITHUB_BRANCH = "content"  # CSV 전용 브랜치. 코드는 main
NL_API_URL = "https://www.nl.go.kr/seoji/SearchApi.do"
GITHUB_API_URL = "https://api.github.com"

# 시크릿 (wrangler secret put): NL_CERT_KEY, GITHUB_TOKEN, RUN_TOKEN
# 알림용 (셋 다 있어야 보낸다): 시크릿 RESEND_API_KEY, 대시보드 변수 NOTIFY_TO, NOTIFY_FROM
